services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      QDRANT_URL: ""
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_TIMEOUT_SECONDS: "${QDRANT_TIMEOUT_SECONDS:-3}"
      QDRANT_COLLECTION_NAME: "${QDRANT_COLLECTION_NAME:-documents}"
      QDRANT_SEED_COLLECTION_NAME: "${QDRANT_SEED_COLLECTION_NAME:-seed_documents}"
      OLLAMA_BASE_URL: "${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-60}"
      HEALTH_TIMEOUT_SECONDS: "${HEALTH_TIMEOUT_SECONDS:-2}"
      RETRIEVAL_SCORE_THRESHOLD: "${RETRIEVAL_SCORE_THRESHOLD:-0.35}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
      CHUNK_SIZE: "${CHUNK_SIZE:-1200}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-200}"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8001}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
